<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>總體經濟指標</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #0f172a;
      color: #f8fafc;

      padding: 12px;
      overflow-x: hidden;
    }

    .card {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;

      background: #1e293b;
      border-radius: 14px;

      padding: 18px;

      border: 1px solid #334155;

      box-shadow:
        0 4px 16px rgba(0, 0, 0, 0.30);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      margin-bottom: 14px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
      margin: 0;
    }

    .updated {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-bottom: 18px;
    }

    .btn {
      appearance: none;

      background: #334155;
      color: #cbd5e1;

      border: 1px solid #475569;

      padding: 8px 14px;

      border-radius: 22px;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background 0.2s,
        color 0.2s,
        opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn.active {
      color: #ffffff;
      border-color: transparent;
    }

    .btn-cpi.active {
      background: #38bdf8;
    }

    .btn-unemp.active {
      background: #f43f5e;
    }

    .btn-oil.active {
      background: #eab308;
      color: #111827;
    }

    .btn-thresh.active {
      background: #a855f7;
    }

    /*
      這裡特別加高。
      Notion / iPad 會依照內容完整顯示，
      不讓 Chart.js 自己產生水平捲動。
    */
    .chart-container {
      position: relative;

      width: 100%;

      height: 520px;

      overflow: hidden;
    }

    canvas {
      display: block !important;

      width: 100% !important;
      height: 100% !important;
    }

    .error {
      display: none;

      padding: 16px;

      background: #450a0a;
      border: 1px solid #7f1d1d;

      border-radius: 10px;

      color: #fecaca;

      line-height: 1.6;
    }

    /*
      iPad portrait
    */
    @media (max-width: 700px) {

      body {
        padding: 8px;
      }

      .card {
        padding: 12px;
        border-radius: 12px;
      }

      .header {
        display: block;
      }

      .title {
        font-size: 16px;
        margin-bottom: 4px;
      }

      .updated {
        font-size: 11px;
      }

      .controls {
        gap: 6px;
        margin-bottom: 12px;
      }

      .btn {
        padding: 7px 10px;
        font-size: 12px;
      }

      /*
        iPad 直向時也保持完整圖表。
      */
      .chart-container {
        height: 460px;
      }
    }

    /*
      很窄的畫面
    */
    @media (max-width: 430px) {

      .btn {
        flex: 1 1 auto;
        text-align: center;
      }

      .chart-container {
        height: 430px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="header">

      <div class="title">
        📊 總體經濟指標
      </div>

      <div class="updated" id="updated">
        正在載入資料…
      </div>

    </div>


    <div class="controls">

      <button
        class="btn btn-cpi active"
        id="btnCpi"
        onclick="toggleDataset(0, this)">
        CPI 通膨率 (%)
      </button>

      <button
        class="btn btn-unemp active"
        id="btnUnemp"
        onclick="toggleDataset(1, this)">
        失業率 (%)
      </button>

      <button
        class="btn btn-oil active"
        id="btnOil"
        onclick="toggleDataset(2, this)">
        原油價格 ($/桶)
      </button>

      <button
        class="btn btn-thresh active"
        id="btnThresh"
        onclick="toggleThresholds(this)">
        警戒線 Thresholds
      </button>

    </div>


    <div class="error" id="error">
      ⚠️ 暫時無法載入經濟數據。<br>
      請稍後重新整理頁面。
    </div>


    <div class="chart-container" id="chartContainer">

      <canvas id="macroChart"></canvas>

    </div>

  </div>


<script>

let chart = null;


/*
  載入 data.json
*/
async function loadData() {

  try {

    /*
      加 timestamp 避免瀏覽器 / Notion 使用舊 cache
    */
    const response = await fetch(
      "data.json?t=" + Date.now(),
      {
        cache: "no-store"
      }
    );

    if (!response.ok) {
      throw new Error("data.json 無法讀取");
    }

    const data = await response.json();

    createChart(data);

    updateLastUpdated(data);

  } catch (error) {

    console.error(error);

    document.getElementById("error").style.display = "block";

    document.getElementById("chartContainer").style.display = "none";
  }

}


/*
  顯示最後更新日期
*/
function updateLastUpdated(data) {

  const element = document.getElementById("updated");

  if (data.last_updated) {

    element.textContent =
      "最後更新：" + data.last_updated;

  } else {

    element.textContent =
      "資料已載入";

  }

}


/*
  建立圖表
*/
function createChart(data) {

  const ctx =
    document
      .getElementById("macroChart")
      .getContext("2d");


  /*
    CPI
  */
  const cpiData =
    Array.isArray(data.cpi)
      ? data.cpi
      : [];


  /*
    Unemployment
  */
  const unemploymentData =
    Array.isArray(data.unemployment)
      ? data.unemployment
      : [];


  /*
    WTI
  */
  const oilData =
    Array.isArray(data.oil)
      ? data.oil
      : [];


  /*
    Thresholds
  */
  const cpiThreshold =
    data.months.map(() => 3.5);

  const unemploymentThreshold =
    data.months.map(() => 4.3);

  const oilThreshold =
    data.months.map(() => 90);


  chart = new Chart(ctx, {

    type: "line",

    data: {

      labels: data.months,

      datasets: [

        /*
          CPI
        */
        {
          label: "CPI (%)",

          data: cpiData,

          borderColor: "#38bdf8",

          backgroundColor: "#38bdf820",

          borderWidth: 3,

          tension: 0.3,

          pointRadius: 4,

          pointHoverRadius: 7,

          spanGaps: true,

          yAxisID: "y"
        },


        /*
          Unemployment
        */
        {
          label: "失業率 (%)",

          data: unemploymentData,

          borderColor: "#f43f5e",

          backgroundColor: "#f43f5e20",

          borderWidth: 3,

          tension: 0.3,

          pointRadius: 4,

          pointHoverRadius: 7,

          spanGaps: true,

          yAxisID: "y"
        },


        /*
          Oil
        */
        {
          label: "油價 ($)",

          data: oilData,

          borderColor: "#eab308",

          backgroundColor: "#eab30820",

          borderWidth: 3,

          tension: 0.3,

          pointRadius: 4,

          pointHoverRadius: 7,

          spanGaps: true,

          yAxisID: "yOil"
        },


        /*
          CPI Threshold
        */
        {
          label: "CPI 警戒線 (3.5%)",

          data: cpiThreshold,

          borderColor: "#38bdf880",

          borderDash: [6, 6],

          borderWidth: 2,

          pointRadius: 0,

          tension: 0,

          yAxisID: "y"
        },


        /*
          Sahm Rule Threshold
        */
        {
          label: "薩姆規則警戒線 (4.3%)",

          data: unemploymentThreshold,

          borderColor: "#f43f5e80",

          borderDash: [6, 6],

          borderWidth: 2,

          pointRadius: 0,

          tension: 0,

          yAxisID: "y"
        },


        /*
          Oil Threshold
        */
        {
          label: "油價警戒線 ($90)",

          data: oilThreshold,

          borderColor: "#eab30880",

          borderDash: [6, 6],

          borderWidth: 2,

          pointRadius: 0,

          tension: 0,

          yAxisID: "yOil"
        }

      ]

    },


    options: {

      responsive: true,

      maintainAspectRatio: false,


      /*
        iPad 觸控友善
      */
      interaction: {

        mode: "index",

        intersect: false

      },


      plugins: {

        legend: {

          display: false

        },

        tooltip: {

          enabled: true,

          mode: "index",

          intersect: false,

          padding: 12,

          titleFont: {
            size: 14,
            weight: "700"
          },

          bodyFont: {
            size: 13
          }

        }

      },


      scales: {

        /*
          X 軸
        */
        x: {

          grid: {

            color: "#33415540"

          },

          ticks: {

            color: "#94a3b8",

            maxRotation: 0,

            minRotation: 0,

            autoSkip: false,

            font: {
              size: 11
            }

          }

        },


        /*
          左邊百分比
        */
        y: {

          type: "linear",

          position: "left",

          min: 2,

          max: 6,

          grid: {

            color: "#33415540"

          },

          ticks: {

            color: "#94a3b8",

            callback: function(value) {

              return value + "%";

            }

          }

        },


        /*
          右邊油價
        */
        yOil: {

          type: "linear",

          position: "right",

          min: 60,

          max: 110,

          grid: {

            drawOnChartArea: false

          },

          ticks: {

            color: "#eab308",

            callback: function(value) {

              return "$" + value;

            }

          }

        }

      }

    }

  });

}


/*
  CPI / 失業率 / 油價 開關
*/
function toggleDataset(index, button) {

  if (!chart) {
    return;
  }

  const visible =
    chart.isDatasetVisible(index);

  chart.setDatasetVisibility(
    index,
    !visible
  );

  button.classList.toggle(
    "active",
    !visible
  );

  chart.update();

}


/*
  Thresholds 開關
*/
function toggleThresholds(button) {

  if (!chart) {
    return;
  }

  const active =
    button.classList.toggle("active");

  [3, 4, 5].forEach(function(index) {

    chart.setDatasetVisibility(
      index,
      active
    );

  });

  chart.update();

}


/*
  啟動
*/
loadData();

</script>

</body>
</html>
