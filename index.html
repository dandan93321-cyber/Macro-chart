<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>總體經濟指標</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background: #0f172a;
      color: #f8fafc;

      padding: 16px;
      overflow-x: hidden;
    }

    .page {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 18px;
      padding: 22px;
      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18);
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .title-icon {
      font-size: 27px;
    }

    .updated-top {
      color: #94a3b8;
      font-size: 14px;
      white-space: nowrap;
    }

    .status-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 12px;
      margin-bottom: 20px;
    }

    .status-box {
      min-height: 72px;
      background: #172236;
      border: 1px solid #334155;
      border-radius: 13px;
      padding: 13px 15px;
    }

    .status-label {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 6px;
    }

    .status-value {
      color: #f1f5f9;
      font-size: 16px;
      font-weight: 700;
    }

    .normal-status {
      color: #22c55e;
    }

    .status-dot {
      display: inline-block;
      width: 19px;
      height: 19px;
      border-radius: 50%;
      background: #16a34a;
      margin-right: 7px;
      vertical-align: -4px;
      box-shadow:
        0 0 12px rgba(34, 197, 94, 0.55);
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .legend-item {
      border-radius: 999px;
      padding: 10px 17px;
      font-size: 15px;
      font-weight: 700;
      color: white;
    }

    .legend-cpi {
      background: #38bdf8;
    }

    .legend-unemployment {
      background: #ff4164;
    }

    .legend-oil {
      background: #f2b900;
      color: #111827;
    }

    .legend-sahm {
      background: #a855f7;
    }

    .chart-wrap {
      position: relative;
      width: 100%;
      height: 610px;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
    }

    .source {
      border-top: 1px solid #334155;
      margin-top: 18px;
      padding-top: 14px;

      text-align: right;

      color: #64748b;
      font-size: 13px;
    }

    .sahm-info {
      margin-top: 15px;
      padding: 14px 16px;

      background: #172236;
      border: 1px solid #334155;
      border-radius: 12px;

      color: #cbd5e1;
      font-size: 14px;
      line-height: 1.6;
    }

    .sahm-info strong {
      color: #f8fafc;
    }

    .triggered {
      color: #ef4444;
      font-weight: 800;
    }

    .not-triggered {
      color: #22c55e;
      font-weight: 800;
    }

    @media (max-width: 800px) {
      body {
        padding: 10px;
      }

      .card {
        padding: 14px;
        border-radius: 15px;
      }

      .header {
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }

      .title {
        font-size: 22px;
      }

      .updated-top {
        font-size: 13px;
      }

      .status-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .status-box {
        min-height: 67px;
        padding: 11px 12px;
      }

      .status-label {
        font-size: 12px;
      }

      .status-value {
        font-size: 14px;
      }

      .legend {
        gap: 7px;
      }

      .legend-item {
        padding: 8px 12px;
        font-size: 13px;
      }

      .chart-wrap {
        height: 500px;
      }

      .source {
        text-align: center;
        line-height: 1.5;
      }
    }

    @media (max-width: 480px) {
      .status-grid {
        grid-template-columns: 1fr 1fr;
      }

      .chart-wrap {
        height: 450px;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <div class="card">

      <!-- ========================= -->
      <!-- Header -->
      <!-- ========================= -->

      <div class="header">

        <h1 class="title">
          <span class="title-icon">📊</span>
          <span>總體經濟指標</span>
        </h1>

        <div
          class="updated-top"
          id="updatedTop"
        >
          最後更新：載入中...
        </div>

      </div>


      <!-- ========================= -->
      <!-- Status -->
      <!-- ========================= -->

      <div class="status-grid">

        <div class="status-box">
          <div class="status-label">
            最後更新
          </div>

          <div
            class="status-value"
            id="lastUpdated"
          >
            載入中...
          </div>
        </div>


        <div class="status-box">
          <div class="status-label">
            下次預計更新
          </div>

          <div
            class="status-value"
            id="nextUpdate"
          >
            2026-09-07 01:00 UTC
          </div>
        </div>


        <div class="status-box">
          <div class="status-label">
            更新頻率
          </div>

          <div class="status-value">
            每週一
          </div>
        </div>


        <div class="status-box">

          <div class="status-label">
            系統狀態
          </div>

          <div
            class="status-value normal-status"
            id="systemStatus"
          >
            <span class="status-dot"></span>
            正常
          </div>

        </div>

      </div>


      <!-- ========================= -->
      <!-- Legend -->
      <!-- ========================= -->

      <div class="legend">

        <div class="legend-item legend-cpi">
          CPI 通膨率 (%)
        </div>

        <div class="legend-item legend-unemployment">
          失業率 (%)
        </div>

        <div class="legend-item legend-oil">
          原油價格 ($/桶)
        </div>

        <div class="legend-item legend-sahm">
          薩姆規則
        </div>

      </div>


      <!-- ========================= -->
      <!-- Chart -->
      <!-- ========================= -->

      <div class="chart-wrap">
        <canvas id="macroChart"></canvas>
      </div>


      <!-- ========================= -->
      <!-- Sahm information -->
      <!-- ========================= -->

      <div
        class="sahm-info"
        id="sahmInfo"
      >
        薩姆規則：載入中...
      </div>


      <!-- ========================= -->
      <!-- Source -->
      <!-- ========================= -->

      <div class="source">
        資料來源：
        Federal Reserve Economic Data (FRED)
        · CPIAUCSL
        · UNRATE
        · DCOILWTICO
      </div>

    </div>

  </div>


  <script>

    // ============================================================
    // 全域設定
    // ============================================================

    let macroChart = null;


    // ============================================================
    // 日期格式
    // ============================================================

    function formatDate(dateString) {

      if (!dateString) {
        return "—";
      }

      return dateString;
    }


    // ============================================================
    // 下一次更新時間
    //
    // GitHub Actions：
    // 每週一 01:00 UTC
    // ============================================================

    function getNextMonday0100UTC() {

      const now = new Date();

      const next = new Date(now);

      const day = now.getUTCDay();

      let daysUntilMonday =
        (8 - day) % 7;

      if (
        daysUntilMonday === 0 &&
        (
          now.getUTCHours() > 1 ||
          (
            now.getUTCHours() === 1 &&
            now.getUTCMinutes() >= 0
          )
        )
      ) {
        daysUntilMonday = 7;
      }

      next.setUTCDate(
        now.getUTCDate() + daysUntilMonday
      );

      next.setUTCHours(1, 0, 0, 0);

      const year =
        next.getUTCFullYear();

      const month =
        String(
          next.getUTCMonth() + 1
        ).padStart(2, "0");

      const date =
        String(
          next.getUTCDate()
        ).padStart(2, "0");

      return `${year}-${month}-${date} 01:00 UTC`;
    }


    // ============================================================
    // Plugin：薩姆規則觸發標記
    //
    // 在 triggered === true 的月份
    // 在圖表上方畫出垂直線與文字
    // ============================================================

    const sahmTriggerPlugin = {

      id: "sahmTriggerPlugin",

      afterDatasetsDraw(chart) {

        const {
          ctx,
          chartArea,
          scales
        } = chart;

        if (!chartArea) {
          return;
        }

        const sahmDataset =
          chart.data.datasets.find(
            dataset =>
              dataset.id === "sahm"
          );

        if (!sahmDataset) {
          return;
        }

        const labels =
          chart.data.labels || [];

        const triggered =
          sahmDataset.triggered || [];

        const xScale =
          scales.x;

        ctx.save();

        for (
          let i = 0;
          i < triggered.length;
          i++
        ) {

          if (!triggered[i]) {
            continue;
          }

          const x =
            xScale.getPixelForValue(i);

          ctx.save();

          ctx.strokeStyle =
            "#ef4444";

          ctx.lineWidth = 2;

          ctx.setLineDash([6, 6]);

          ctx.beginPath();

          ctx.moveTo(
            x,
            chartArea.top
          );

          ctx.lineTo(
            x,
            chartArea.bottom
          );

          ctx.stroke();

          ctx.setLineDash([]);

          ctx.fillStyle =
            "#ef4444";

          ctx.font =
            "bold 12px -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif";

          ctx.textAlign = "center";

          ctx.fillText(
            "薩姆規則觸發",
            x,
            chartArea.top + 18
          );

          ctx.restore();
        }

        ctx.restore();
      }
    };


    // ============================================================
    // 載入資料
    // ============================================================

    async function loadData() {

      try {

        const response =
          await fetch(
            "data.json?v=" +
            Date.now()
          );

        if (!response.ok) {
          throw new Error(
            "無法取得 data.json"
          );
        }

        const data =
          await response.json();

        renderPage(data);

      } catch (error) {

        console.error(error);

        document.getElementById(
          "systemStatus"
        ).innerHTML =
          '<span class="status-dot"></span>資料讀取失敗';

        document.getElementById(
          "systemStatus"
        ).style.color =
          "#ef4444";

        document.getElementById(
          "sahmInfo"
        ).innerHTML =
          "無法讀取經濟資料，請稍後重新整理頁面。";
      }
    }


    // ============================================================
    // Render
    // ============================================================

    function renderPage(data) {

      const months =
        Array.isArray(data.months)
          ? data.months
          : [];

      const cpi =
        Array.isArray(data.cpi)
          ? data.cpi
          : [];

      const unemployment =
        Array.isArray(data.unemployment)
          ? data.unemployment
          : [];

      const oil =
        Array.isArray(data.oil)
          ? data.oil
          : [];

      const sahm =
        Array.isArray(data.sahm_rule)
          ? data.sahm_rule
          : [];

      const sahmTriggered =
        Array.isArray(data.sahm_triggered)
          ? data.sahm_triggered
          : [];

      const sahmAverage =
        Array.isArray(
          data.sahm_three_month_average
        )
          ? data.sahm_three_month_average
          : [];

      const sahmLow =
        Array.isArray(
          data.sahm_low_12_month
        )
          ? data.sahm_low_12_month
          : [];

      const sahmThreshold =
        Number.isFinite(
          Number(data.sahm_threshold)
        )
          ? Number(data.sahm_threshold)
          : 0.5;


      // ----------------------------------------------------------
      // 更新日期
      // ----------------------------------------------------------

      const updated =
        formatDate(
          data.last_updated
        );

      document.getElementById(
        "lastUpdated"
      ).textContent =
        updated;

      document.getElementById(
        "updatedTop"
      ).textContent =
        "最後更新：" + updated;


      // ----------------------------------------------------------
      // 下一次更新
      // ----------------------------------------------------------

      document.getElementById(
        "nextUpdate"
      ).textContent =
        getNextMonday0100UTC();


      // ----------------------------------------------------------
      // 找最新薩姆規則資料
      // ----------------------------------------------------------

      let latestSahmIndex = -1;

      for (
        let i = sahm.length - 1;
        i >= 0;
        i--
      ) {

        if (
          sahm[i] !== null &&
          sahm[i] !== undefined
        ) {
          latestSahmIndex = i;
          break;
        }
      }


      // ----------------------------------------------------------
      // 薩姆規則資訊
      // ----------------------------------------------------------

      if (latestSahmIndex >= 0) {

        const latestValue =
          Number(
            sahm[latestSahmIndex]
          );

        const latestAvg =
          Number(
            sahmAverage[latestSahmIndex]
          );

        const latestLow =
          Number(
            sahmLow[latestSahmIndex]
          );

        const latestTriggered =
          Boolean(
            sahmTriggered[
              latestSahmIndex
            ]
          );

        const latestMonth =
          months[latestSahmIndex];

        const statusText =
          latestTriggered
            ? '<span class="triggered">⚠ 薩姆規則已觸發</span>'
            : '<span class="not-triggered">✓ 薩姆規則未觸發</span>';

        document.getElementById(
          "sahmInfo"
        ).innerHTML =

          `<strong>薩姆規則</strong>　` +

          `最新月份：<strong>${latestMonth || "—"}</strong>　` +

          `3M 移動平均：<strong>${Number.isFinite(latestAvg) ? latestAvg.toFixed(2) : "—"}%</strong>　` +

          `過去 12 個月最低：<strong>${Number.isFinite(latestLow) ? latestLow.toFixed(2) : "—"}%</strong>　` +

          `薩姆值：<strong>${Number.isFinite(latestValue) ? latestValue.toFixed(2) : "—"}%</strong>　` +

          `門檻：<strong>${sahmThreshold.toFixed(2)}%</strong>　` +

          statusText;

      } else {

        document.getElementById(
          "sahmInfo"
        ).innerHTML =

          `<strong>薩姆規則</strong>　` +
          `目前尚無足夠資料計算。`;
      }


      // ----------------------------------------------------------
      // 觸發狀態
      // ----------------------------------------------------------

      const anyTriggered =
        sahmTriggered.some(
          value => value === true
        );

      // 注意：
      // 這裡顯示的是「最新月份」狀態，
      // 不只是歷史上曾經觸發。

      let currentTriggered =
        false;

      if (latestSahmIndex >= 0) {
        currentTriggered =
          Boolean(
            sahmTriggered[
              latestSahmIndex
            ]
          );
      }

      if (currentTriggered) {

        document.getElementById(
          "systemStatus"
        ).innerHTML =
          '<span class="status-dot" style="background:#ef4444;box-shadow:0 0 12px rgba(239,68,68,.55);"></span>薩姆規則觸發';

        document.getElementById(
          "systemStatus"
        ).style.color =
          "#ef4444";

      } else {

        document.getElementById(
          "systemStatus"
        ).innerHTML =
          '<span class="status-dot"></span>正常';

        document.getElementById(
          "systemStatus"
        ).style.color =
          "#22c55e";
      }


      // ----------------------------------------------------------
      // 建立圖表
      // ----------------------------------------------------------

      const ctx =
        document
          .getElementById(
            "macroChart"
          )
          .getContext("2d");


      if (macroChart) {
        macroChart.destroy();
      }


      // ----------------------------------------------------------
      // 薩姆規則觸發點
      // ----------------------------------------------------------

      const sahmPointRadius =
        sahm.map(
          (value, index) => {

            if (
              value === null ||
              value === undefined
            ) {
              return 0;
            }

            return sahmTriggered[index]
              ? 7
              : 3;
          }
        );


      // ----------------------------------------------------------
      // Chart
      // ----------------------------------------------------------

      macroChart =
        new Chart(
          ctx,
          {
            type: "line",

            data: {

              labels: months,

              datasets: [

                // ==================================================
                // CPI
                // ==================================================

                {
                  id: "cpi",

                  label:
                    "CPI 通膨率 (%)",

                  data: cpi,

                  yAxisID:
                    "y",

                  borderColor:
                    "#38bdf8",

                  backgroundColor:
                    "#38bdf8",

                  borderWidth: 3,

                  pointRadius: 5,

                  pointHoverRadius: 7,

                  pointBorderWidth: 2,

                  tension: 0.25,

                  spanGaps: true
                },


                // ==================================================
                // Unemployment
                // ==================================================

                {
                  id: "unemployment",

                  label:
                    "失業率 (%)",

                  data: unemployment,

                  yAxisID:
                    "y",

                  borderColor:
                    "#ff4164",

                  backgroundColor:
                    "#ff4164",

                  borderWidth: 3,

                  pointRadius: 5,

                  pointHoverRadius: 7,

                  pointBorderWidth: 2,

                  tension: 0.25,

                  spanGaps: true
                },


                // ==================================================
                // WTI Oil
                // ==================================================

                {
                  id: "oil",

                  label:
                    "原油價格 ($/桶)",

                  data: oil,

                  yAxisID:
                    "yOil",

                  borderColor:
                    "#f2b900",

                  backgroundColor:
                    "#f2b900",

                  borderWidth: 3,

                  pointRadius: 5,

                  pointHoverRadius: 7,

                  pointBorderWidth: 2,

                  tension: 0.25,

                  spanGaps: true
                },


                // ==================================================
                // Sahm Rule
                // ==================================================

                {
                  id: "sahm",

                  label:
                    "薩姆規則",

                  data: sahm,

                  yAxisID:
                    "y",

                  borderColor:
                    "#a855f7",

                  backgroundColor:
                    "#a855f7",

                  borderWidth: 3,

                  pointRadius:
                    sahmPointRadius,

                  pointHoverRadius: 8,

                  pointBorderWidth: 2,

                  tension: 0.15,

                  spanGaps: true,

                  triggered:
                    sahmTriggered
                },


                // ==================================================
                // Sahm Threshold
                //
                // 只有薩姆規則使用 threshold
                // ==================================================

                {
                  id: "sahmThreshold",

                  label:
                    "薩姆規則門檻 (0.5%)",

                  data:
                    months.map(
                      () => sahmThreshold
                    ),

                  yAxisID:
                    "y",

                  borderColor:
                    "rgba(168, 85, 247, 0.65)",

                  backgroundColor:
                    "rgba(168, 85, 247, 0.65)",

                  borderWidth: 2,

                  borderDash:
                    [7, 7],

                  pointRadius: 0,

                  pointHoverRadius: 0,

                  tension: 0,

                  spanGaps: true
                }

              ]
            },


            options: {

              responsive: true,

              maintainAspectRatio: false,

              interaction: {
                mode: "index",
                intersect: false
              },

              plugins: {

                legend: {
                  display: false
                },

                tooltip: {

                  backgroundColor:
                    "rgba(0, 0, 0, 0.92)",

                  titleColor:
                    "#ffffff",

                  bodyColor:
                    "#f1f5f9",

                  borderColor:
                    "#475569",

                  borderWidth: 1,

                  padding: 12,

                  displayColors: true,

                  callbacks: {

                    label:
                      function(context) {

                        const dataset =
                          context.dataset;

                        const value =
                          context.parsed.y;

                        if (
                          value === null ||
                          value === undefined
                        ) {
                          return null;
                        }

                        if (
                          dataset.id ===
                          "oil"
                        ) {

                          return (
                            "原油價格: $" +
                            Number(value)
                              .toFixed(2)
                          );
                        }

                        if (
                          dataset.id ===
                          "sahm"
                        ) {

                          const index =
                            context.dataIndex;

                          const triggered =
                            sahmTriggered[index];

                          return (
                            "薩姆規則: " +
                            Number(value)
                              .toFixed(2) +
                            "%" +
                            (
                              triggered
                                ? " ⚠ 觸發"
                                : ""
                            )
                          );
                        }

                        if (
                          dataset.id ===
                          "sahmThreshold"
                        ) {

                          return (
                            "薩姆門檻: " +
                            Number(value)
                              .toFixed(2) +
                            "%"
                          );
                        }

                        if (
                          dataset.id ===
                          "cpi"
                        ) {

                          return (
                            "CPI 通膨率: " +
                            Number(value)
                              .toFixed(2) +
                            "%"
                          );
                        }

                        if (
                          dataset.id ===
                          "unemployment"
                        ) {

                          return (
                            "失業率: " +
                            Number(value)
                              .toFixed(2) +
                            "%"
                          );
                        }

                        return (
                          dataset.label +
                          ": " +
                          Number(value)
                            .toFixed(2)
                        );
                      }
                  }
                }
              },


              scales: {

                // ==================================================
                // 左側：百分比
                // ==================================================

                y: {

                  position: "left",

                  beginAtZero: false,

                  suggestedMin: 0,

                  suggestedMax: 6,

                  grid: {

                    color:
                      "rgba(71, 85, 105, 0.22)",

                    drawBorder: false
                  },

                  ticks: {

                    color:
                      "#94a3b8",

                    font: {
                      size: 13
                    },

                    callback:
                      function(value) {

                        return value + "%";
                      }
                  }
                },


                // ==================================================
                // 右側：原油
                // ==================================================

                yOil: {

                  position: "right",

                  beginAtZero: false,

                  suggestedMin: 50,

                  suggestedMax: 110,

                  grid: {

                    drawOnChartArea: false,

                    drawBorder: false
                  },

                  ticks: {

                    color:
                      "#f2b900",

                    font: {
                      size: 13
                    },

                    callback:
                      function(value) {

                        return "$" +
                          value;
                      }
                  }
                },


                // ==================================================
                // X 軸
                // ==================================================

                x: {

                  grid: {

                    color:
                      "rgba(71, 85, 105, 0.15)",

                    drawBorder: false
                  },

                  ticks: {

                    color:
                      "#94a3b8",

                    maxRotation: 0,

                    autoSkip: false,

                    font: {
                      size: 12
                    }
                  }
                }
              }
            },

            plugins: [
              sahmTriggerPlugin
            ]
          }
        );
    }


    // ============================================================
    // 啟動
    // ============================================================

    loadData();

  </script>

</body>
