name: Weekly Data Update

on:
  schedule:
    # 每週一 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch economic data
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone

          SOURCES = {
              "cpi": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL",
              "unemployment": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=UNRATE",
              "oil": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILWTICO"
          }

          def download_csv(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )

              with urllib.request.urlopen(req, timeout=60) as response:
                  return response.read().decode("utf-8")

          def read_series(url):
              text = download_csv(url)
              rows = csv.DictReader(io.StringIO(text))

              result = []

              for row in rows:
                  date = row.get("observation_date")
                  keys = list(row.keys())

                  if len(keys) < 2:
                      continue

                  value = row.get(keys[1])

                  if not date or not value:
                      continue

                  if value in (".", ""):
                      continue

                  try:
                      result.append((date, float(value)))
                  except ValueError:
                      continue

              return result

          # -------------------------
          # CPI
          # -------------------------
          cpi_raw = read_series(SOURCES["cpi"])
          cpi_by_date = dict(cpi_raw)

          cpi_inflation = []

          for date, value in cpi_raw:
              year = int(date[:4])
              month = date[5:7]

              previous_year = f"{year - 1}-{month}-01"

              if previous_year in cpi_by_date:
                  previous = cpi_by_date[previous_year]

                  inflation = ((value / previous) - 1) * 100

                  cpi_inflation.append(
                      (date, round(inflation, 2))
                  )

          # -------------------------
          # Unemployment
          # -------------------------
          unemployment_raw = read_series(
              SOURCES["unemployment"]
          )

          # -------------------------
          # WTI Oil
          # -------------------------
          oil_raw = read_series(SOURCES["oil"])

          # -------------------------
          # Monthly latest
          # -------------------------
          def monthly_latest(series, months=24):
              monthly = {}

              for date, value in series:
                  key = date[:7]
                  monthly[key] = (date, value)

              keys = sorted(monthly.keys())[-months:]

              return [
                  (key, monthly[key][1])
                  for key in keys
              ]

          # 保留 24 個月，
          # 方便薩姆規則計算 12 個月低點
          cpi_monthly = monthly_latest(
              cpi_inflation,
              24
          )

          unemployment_monthly = monthly_latest(
              unemployment_raw,
              24
          )

          oil_monthly = monthly_latest(
              oil_raw,
              24
          )

          # -------------------------
          # Align months
          # -------------------------
          months = sorted(
              set(x[0] for x in cpi_monthly)
              | set(x[0] for x in unemployment_monthly)
              | set(x[0] for x in oil_monthly)
          )[-24:]

          cpi_dict = dict(cpi_monthly)
          unemployment_dict = dict(unemployment_monthly)
          oil_dict = dict(oil_monthly)

          unemployment_values = [
              unemployment_dict.get(month)
              for month in months
          ]

          # -------------------------
          # Sahm Rule
          #
          # 3-month moving average
          # vs.
          # lowest unemployment rate
          # during previous 12 months + 0.5
          # -------------------------
          sahm_average = []
          sahm_threshold = []
          sahm_triggered = []

          for i in range(len(months)):

              # 3-month moving average
              if i >= 2:
                  values_3m = unemployment_values[i-2:i+1]

                  if all(v is not None for v in values_3m):
                      avg_3m = sum(values_3m) / 3
                  else:
                      avg_3m = None
              else:
                  avg_3m = None

              # Previous 12 months including current month
              start = max(0, i - 11)

              values_12m = [
                  v
                  for v in unemployment_values[start:i+1]
                  if v is not None
              ]

              if len(values_12m) > 0:
                  lowest_12m = min(values_12m)
                  threshold = lowest_12m + 0.5
              else:
                  threshold = None

              if (
                  avg_3m is not None
                  and threshold is not None
              ):
                  triggered = avg_3m >= threshold
              else:
                  triggered = False

              sahm_average.append(
                  round(avg_3m, 2)
                  if avg_3m is not None
                  else None
              )

              sahm_threshold.append(
                  round(threshold, 2)
                  if threshold is not None
                  else None
              )

              sahm_triggered.append(triggered)

          # -------------------------
          # Final data
          # -------------------------
          data = {
              "last_updated":
                  datetime.now(timezone.utc).strftime("%Y-%m-%d"),

              "months": months,

              "cpi": [
                  cpi_dict.get(month)
                  for month in months
              ],

              "unemployment": unemployment_values,

              "oil": [
                  round(oil_dict[month], 2)
                  if month in oil_dict
                  else None
                  for month in months
              ],

              "sahm_average": sahm_average,

              "sahm_threshold": sahm_threshold,

              "sahm_triggered": sahm_triggered
          }

          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  data,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print(
              json.dumps(
                  data,
                  ensure_ascii=False,
                  indent=2
              )
          )
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update economic data"

          git push
