name: Weekly Data Update

on:
  schedule:
    # 每週一 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch economic data
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import urllib.request
          from datetime import datetime, timezone

          SOURCES = {
              "cpi": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL",
              "unemployment": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=UNRATE",
              "oil": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DCOILWTICO"
          }

          def download_csv(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  return response.read().decode("utf-8")

          def read_series(url):
              text = download_csv(url)
              rows = csv.DictReader(io.StringIO(text))

              result = []

              for row in rows:
                  date = row.get("observation_date")
                  value = row.get(list(row.keys())[1])

                  if not date or not value:
                      continue

                  if value in (".", ""):
                      continue

                  try:
                      result.append((date, float(value)))
                  except ValueError:
                      continue

              return result

          # -------------------------
          # CPI
          # -------------------------
          cpi_raw = read_series(SOURCES["cpi"])

          # Convert CPI index into year-over-year inflation %
          cpi_by_date = dict(cpi_raw)

          cpi_inflation = []

          for date, value in cpi_raw:
              year = int(date[:4])
              month = date[5:7]

              previous_year = f"{year - 1}-{month}-01"

              if previous_year in cpi_by_date:
                  previous = cpi_by_date[previous_year]
                  inflation = ((value / previous) - 1) * 100
                  cpi_inflation.append((date, round(inflation, 2)))

          # -------------------------
          # Unemployment
          # -------------------------
          unemployment_raw = read_series(SOURCES["unemployment"])

          # -------------------------
          # WTI Oil
          # -------------------------
          oil_raw = read_series(SOURCES["oil"])

          # Keep the latest 12 monthly points for CPI/unemployment.
          # Oil is converted to monthly latest available price.
          def monthly_latest(series, months=12):
              monthly = {}

              for date, value in series:
                  key = date[:7]
                  monthly[key] = (date, value)

              keys = sorted(monthly.keys())[-months:]

              return [
                  (key, monthly[key][1])
                  for key in keys
              ]

          cpi_monthly = monthly_latest(cpi_inflation)
          unemployment_monthly = monthly_latest(unemployment_raw)

          # Oil: latest observation in each month
          oil_monthly = monthly_latest(oil_raw)

          # Align all chart months
          months = sorted(
              set(x[0] for x in cpi_monthly)
              | set(x[0] for x in unemployment_monthly)
              | set(x[0] for x in oil_monthly)
          )[-12:]

          cpi_dict = dict(cpi_monthly)
          unemployment_dict = dict(unemployment_monthly)
          oil_dict = dict(oil_monthly)

          data = {
              "last_updated": datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "months": months,
              "cpi": [
                  cpi_dict.get(month, None)
                  for month in months
              ],
              "unemployment": [
                  unemployment_dict.get(month, None)
                  for month in months
              ],
              "oil": [
                  round(oil_dict[month], 2)
                  if month in oil_dict else None
                  for month in months
              ]
          }

          with open("data.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)

          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          git diff --cached --quiet || git commit -m "Update economic data"

          git push
